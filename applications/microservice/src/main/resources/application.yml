server:
  port: 8081
  servlet:
    context-path: /microservice

app:
  environment: ${APP_ENVIRONMENT:local}

spring:
  application:
    name: microservice
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_password}
    hikari:
      initializationFailTimeout: 0
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
