services:
  frontend:
    build:
      context: ./frontend-angular
    container_name: frontend
    restart: unless-stopped
    ports:
      - "9091:8080"
    depends_on:
      - monolith
    networks:
      - frontend-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  monolith:
    build:
      context: ./monolith
    container_name: monolith
    restart: unless-stopped
    ports:
      - "9092:8080"
    environment:
      MICROSERVICE_URL: http://microservice:8081/microservice
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1024m"
      DB_HOST: ${MYSQL_HOST:-mysql-db}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${MYSQL_DB:-app_db}
      DB_USER: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_password}
    depends_on:
      microservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/monolith/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - frontend-net
      - backend-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  microservice:
    build:
      context: ./microservice
    container_name: microservice
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: local
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      DB_HOST: ${MYSQL_HOST:-mysql-db}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${MYSQL_DB:-app_db}
      DB_USER: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_password}
    ports:
      - "9093:8081"
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/microservice/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-app_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../infra/database/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${MYSQL_USER:-app_user} -p${MYSQL_PASSWORD:-app_password} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge