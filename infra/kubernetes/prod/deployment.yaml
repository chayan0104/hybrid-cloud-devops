apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice
  namespace: enterprise-prod
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: microservice
      track: stable
  template:
    metadata:
      labels:
        app: microservice
        track: stable
    spec:
      containers:
        - name: microservice
          image: __MICROSERVICE_IMAGE__
          ports:
            - containerPort: 8081
          env:
            - name: APP_ENVIRONMENT
              value: prod
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi