apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice
  namespace: enterprise-perf-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservice
      track: stable
  template:
    metadata:
      labels:
        app: microservice
        track: stable
    spec:
      containers:
        - name: microservice
          image: __MICROSERVICE_IMAGE__
          ports:
            - containerPort: 8081
          env:
            - name: APP_ENVIRONMENT
              value: perf-prod
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: password
          readinessProbe:
            httpGet:
              path: /microservice/actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /microservice/actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
