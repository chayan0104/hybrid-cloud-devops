apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: enterprise-uat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: jfrog-registry
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          env:
            - name: MONOLITH_UPSTREAM
              value: "http://monolith:80"
            - name: MICROSERVICE_UPSTREAM
              value: "http://microservice:80"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi