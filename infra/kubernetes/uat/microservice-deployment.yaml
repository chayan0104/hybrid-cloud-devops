apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice
  namespace: enterprise-uat
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: microservice
      track: stable
  template:
    metadata:
      labels:
        app: microservice
        track: stable
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: microservice
          image: __MICROSERVICE_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: microservice-config
            - secretRef:
                name: microservice-secrets
          readinessProbe:
            httpGet:
              path: /microservice/actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /microservice/actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
