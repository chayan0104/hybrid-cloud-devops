apiVersion: v1
kind: Namespace
metadata:
  name: enterprise-app
  labels:
    environment: prod
    app: hybrid-cloud-devops
---
# Resource Quota for namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: enterprise-quota
  namespace: enterprise-app
spec:
  hard:
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "40"
    limits.memory: "80Gi"
    pods: "100"
    services: "20"
    persistentvolumeclaims: "10"
---
# Network Policy - Default deny ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: enterprise-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Network Policy - Allow ingress from ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress
  namespace: enterprise-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
---
# Service Account for apps
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enterprise-app-sa
  namespace: enterprise-app
---
# Role for app service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enterprise-app-role
  namespace: enterprise-app
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
# RoleBinding for app service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enterprise-app-rolebinding
  namespace: enterprise-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enterprise-app-role
subjects:
  - kind: ServiceAccount
    name: enterprise-app-sa
    namespace: enterprise-app
