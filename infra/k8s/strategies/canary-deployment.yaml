---
# Canary Deployment Strategy for Microservice
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-canary
  namespace: enterprise-app
  labels:
    app: microservice
    track: canary
    version: canary
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: microservice
      track: canary
  template:
    metadata:
      labels:
        app: microservice
        track: canary
        version: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/microservice/actuator/prometheus"
    spec:
      serviceAccountName: enterprise-app-sa
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: microservice
          image: __MICROSERVICE_IMAGE_CANARY__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: microservice-config
            - secretRef:
                name: microservice-secrets
          env:
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseG1GC"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod,canary"
          readinessProbe:
            httpGet:
              path: /microservice/actuator/health/readiness
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /microservice/actuator/health/liveness
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
# Canary Service for traffic splitting (requires Istio or manual weight management)
apiVersion: v1
kind: Service
metadata:
  name: microservice-canary
  namespace: enterprise-app
  labels:
    app: microservice
    track: canary
spec:
  selector:
    app: microservice
    track: canary
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
