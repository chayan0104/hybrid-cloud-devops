---
# Blue Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-blue
  namespace: enterprise-app
  labels:
    app: microservice
    slot: blue
    version: v1
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: microservice
      slot: blue
  template:
    metadata:
      labels:
        app: microservice
        slot: blue
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      serviceAccountName: enterprise-app-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: microservice
          image: __MICROSERVICE_IMAGE_BLUE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: microservice-config
            - secretRef:
                name: microservice-secrets
          readinessProbe:
            httpGet:
              path: /microservice/actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /microservice/actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
# Green Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-green
  namespace: enterprise-app
  labels:
    app: microservice
    slot: green
    version: v1-new
spec:
  replicas: 0  # Start with 0, scale up when ready to switch
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: microservice
      slot: green
  template:
    metadata:
      labels:
        app: microservice
        slot: green
        version: v1-new
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      serviceAccountName: enterprise-app-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: microservice
          image: __MICROSERVICE_IMAGE_GREEN__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: microservice-config
            - secretRef:
                name: microservice-secrets
          readinessProbe:
            httpGet:
              path: /microservice/actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /microservice/actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
# Active Service (points to either Blue or Green)
apiVersion: v1
kind: Service
metadata:
  name: microservice-active
  namespace: enterprise-app
  labels:
    app: microservice
spec:
  selector:
    app: microservice
    slot: blue  # Change to 'green' when ready to switch
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
