replicaCount: 2

image:
  repository: mechayan97/microservice
  tag: latest
  pullPolicy: IfNotPresent

dbSecretName: db-secrets

service:
  type: ClusterIP
  port: 80
  targetPort: 8081

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi

env:
  APP_ENVIRONMENT: uat
