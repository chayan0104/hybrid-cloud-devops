nameOverride: monolith
fullnameOverride: monolith

replicaCount: 3

image:
  repository: registry.example.com/docker-local/monolith
  tag: replace-with-ci-build-number
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

config:
  env:
    APP_ENVIRONMENT: prod
    JAVA_TOOL_OPTIONS: -Xms512m -Xmx1024m
    MICROSERVICE_URL: http://microservice/microservice

secretProvider:
  enabled: true
  targetSecretName: monolith-secrets
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: secret/data/prod/db
        property: db_host
    - secretKey: DB_PORT
      remoteRef:
        key: secret/data/prod/db
        property: db_port
    - secretKey: DB_NAME
      remoteRef:
        key: secret/data/prod/db
        property: db_name
    - secretKey: DB_USER
      remoteRef:
        key: secret/data/prod/db
        property: db_user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/data/prod/db
        property: db_password

probes:
  readiness:
    path: /monolith/health
    initialDelaySeconds: 20
    periodSeconds: 5
  liveness:
    path: /monolith/health
    initialDelaySeconds: 40
    periodSeconds: 10

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi
