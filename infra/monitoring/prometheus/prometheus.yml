global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "microservice"
    static_configs:
      - targets: ["microservice.enterprise-uat.svc.cluster.local:80"]
    metrics_path: /microservice/actuator/prometheus

  - job_name: "weblogic"
    static_configs:
      - targets: ["uat-weblogic.internal:7001"]
