route:
  receiver: team-email
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: team-email
    email_configs:
      - to: devops-team@example.com
        from: alertmanager@example.com
        smarthost: smtp.example.com:587
        auth_username: alertmanager@example.com
        auth_password: REPLACE_SMTP_PASSWORD